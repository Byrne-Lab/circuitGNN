[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "circuit-gnn"
dynamic = ["version"]
description = "Inference of signed synaptic connectivity from spike trains with a graph neural network"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Archit Gupta" },
    { name = "Curtis L. Neveu" },
    { name = "John H. Byrne" },
]
keywords = ["neuroscience", "connectomics", "spike trains", "graph neural network"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "torch>=2.0",
    "matplotlib>=3.7",
    "seaborn>=0.12",
]

[project.optional-dependencies]
paper = ["pandas>=2.0"]

[project.urls]
Homepage = "https://github.com/Byrne-Lab/circuitGNN"
Issues = "https://github.com/Byrne-Lab/circuitGNN/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "circuit_gnn.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
# raised inside torch's own DataLoader pin_memory code, not by this package
filterwarnings = ["ignore:The argument 'device' of Tensor:DeprecationWarning"]
